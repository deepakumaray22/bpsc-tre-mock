name: Build Android APK

on:
push:
branches:
- main
- master
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Setup Java 17
    uses: actions/setup-java@v5
    with:
      distribution: 'temurin'
      java-version: '17'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Setup Project Files and HTML
    run: |
      mkdir -p www
      if [ -f "www/index.html" ]; then
        echo "Found www/index.html"
      elif [ -f "index.html" ]; then
        echo "Found root index.html -> copying to www/index.html"
        cp index.html www/index.html
      else
        FOUND_HTML=$(find . -maxdepth 3 -iname "*index*.html" | head -n 1)
        if [ -n "$FOUND_HTML" ]; then
          echo "Found $FOUND_HTML -> copying to www/index.html"
          cp "$FOUND_HTML" www/index.html
        fi
      fi

      if [ ! -f "package.json" ]; then
        echo '{"name":"bpsc-tre-mock","version":"1.0.0","dependencies":{"@capacitor/android":"^6.0.0","@capacitor/cli":"^6.0.0","@capacitor/core":"^6.0.0"}}' > package.json
      fi

      if [ ! -f "capacitor.config.json" ]; then
        echo '{"appId":"com.deepakray.bpsctre","appName":"BPSC TRE 4.0 Maths Mock","webDir":"www","bundledWebRuntime":false}' > capacitor.config.json
      fi

  - name: Install Dependencies
    run: npm install

  - name: Configure Capacitor Android Platform
    run: |
      if [ -d "android" ] && [ ! -f "android/gradlew" ]; then
        rm -rf android
      fi

      if [ ! -d "android" ]; then
        npx cap add android
      fi

      mkdir -p android/app/src/main/assets/public
      if [ ! -f "android/app/src/main/assets/capacitor.plugins.json" ]; then
        echo "[]" > android/app/src/main/assets/capacitor.plugins.json
      fi

      npx cap copy android
      npx cap sync android

  - name: Compile APK via Gradle
    run: |
      cd android
      chmod +x ./gradlew
      ./gradlew assembleDebug --no-daemon --stacktrace

  - name: Upload Finished APK
    uses: actions/upload-artifact@v4
    with:
      name: BPSC-TRE-4.0-Maths-Mock-APK
      path: android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      
